name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependency-contract:
    name: Dependency contract (Cloudflare frozen Bun install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test stale-override regression guard
        run: node --test scripts/test/dependency-contract.test.mjs
      - name: Verify npm and Bun lockfiles agree
        run: npm run deps:check
      - name: Reproduce Cloudflare frozen install
        run: npm exec --yes --package="bun@$(cat .bun-version)" -- bun install --frozen-lockfile
      - name: Build with Bun-installed dependencies
        run: npm run build
      - name: Ensure install did not rewrite dependency inputs
        run: git diff --exit-code -- package.json package-lock.json bun.lock bunfig.toml

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint (frontend, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests (excluding live-network AI suite)
        run: npx vitest run --exclude test/ai.test.ts

  tuition-browser:
    name: Isolated tuition UI (mock data, no external writes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_MOCKS: "true"
      - run: npx playwright test e2e/tuition.spec.ts e2e/private-cache.spec.ts --project=chromium
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE: http://127.0.0.1:8787
          E2E_START_SERVER: "true"

  auth-recovery-browser:
    name: Auth recovery and service-worker privacy (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src/routes/auth.sign-in.tsx src/routes/auth.sign-up.tsx src/routes/privacy.tsx
      - run: npm run test:service-worker
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_ENABLE_MOCKS: "false"
      - run: npx playwright test e2e/auth-recovery.spec.ts e2e/student-learning.spec.ts --project=chromium --reporter=line,github
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE: http://127.0.0.1:8787
          E2E_START_SERVER: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-recovery-reports
          path: test-results/

  ai-live:
    name: Backend AI live-network tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check for AI API key
        id: key
        run: |
          if [ -n "$AI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        if: steps.key.outputs.present == 'true'
      - run: echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" > .dev.vars
        if: steps.key.outputs.present == 'true'
      - run: npx vitest run test/ai.test.ts
        if: steps.key.outputs.present == 'true'
