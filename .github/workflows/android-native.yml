name: Native Android preview
on:
  push:
    branches: ['arena/df91cdba-lumina-studio']
    paths: ['apps/android-native/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['apps/android-native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject website-rendering dependencies in native app source
        run: |
          if grep -R -n -E 'android\.webkit|com\.getcapacitor|BridgeActivity|react-native-webview' apps/android-native/app/src apps/android-native/app/build.gradle.kts; then
            echo '::error::Native preview must not embed website screens.'
            exit 1
          fi
      - name: Build and verify native app
        working-directory: apps/android-native
        run: |
          chmod +x gradlew
          if ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug > native-build.log 2>&1; then
            tail -25 native-build.log
          else
            python3 -c 'from pathlib import Path; s=Path("native-build.log").read_text()[-3000:]; print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native screens with local fixtures (no backend writes)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          working-directory: apps/android-native
          script: ./gradlew :app:connectedDebugAndroidTest > native-emulator.log 2>&1 || (python3 -c 'from pathlib import Path; s=Path("native-emulator.log").read_text()[-3000:]; print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'; exit 1)
      - name: Publish emulator failure details
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('apps/android-native/app/build/outputs/androidTest-results/**/*.xml',recursive=True):
            try: root=ET.parse(path).getroot()
            except ET.ParseError: continue
            for item in list(root.iter('failure'))+list(root.iter('error')):
              text=(item.get('message','')+' '+(item.text or ''))[:3000]
              print('::error::'+text.replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cea-native-preview-debug
          path: apps/android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-reports
          path: |
            apps/android-native/app/build/reports/
            apps/android-native/app/build/outputs/androidTest-results/
