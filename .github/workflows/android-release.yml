name: Android signed release candidate
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New positive Play version code (must exceed previously uploaded codes)'
        required: true
      version_name:
        description: 'Release version, for example 1.0.0'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: android-release
    env:
      CEA_VERSION_CODE: ${{ inputs.version_code }}
      CEA_VERSION_NAME: ${{ inputs.version_name }}
      CEA_KEYSTORE_PASSWORD: ${{ secrets.CEA_KEYSTORE_PASSWORD }}
      CEA_KEY_ALIAS: ${{ secrets.CEA_KEY_ALIAS }}
      CEA_KEY_PASSWORD: ${{ secrets.CEA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate inputs and load owner-controlled signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CEA_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64
          from pathlib import Path
          if not re.fullmatch(r'[1-9][0-9]{0,8}',os.environ['CEA_VERSION_CODE']): raise SystemExit('Invalid version code')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',os.environ['CEA_VERSION_NAME']): raise SystemExit('Invalid version name')
          for name in ['KEYSTORE_BASE64','CEA_KEYSTORE_PASSWORD','CEA_KEY_ALIAS','CEA_KEY_PASSWORD']:
            if not os.environ.get(name): raise SystemExit('Missing signing configuration: '+name)
          path=Path(os.environ['RUNNER_TEMP'])/'cea-upload.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CEA_KEYSTORE_PATH='+str(path)+'\n')
          PY
      - run: npm ci && npm run typecheck && npm run sync
        working-directory: apps/android
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease bundleRelease assembleRelease
        working-directory: apps/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: cea-signed-release-candidate
          path: |
            apps/android/android/app/build/outputs/bundle/release/*.aab
            apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cea-upload.jks"
