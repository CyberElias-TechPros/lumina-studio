name: Android debug APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/android/**', 'src/data/blog.ts', '.github/workflows/android.yml']
  push:
    branches: ['arena/df91cdba-lumina-studio']
    paths: ['apps/android/**', 'src/data/blog.ts', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run typecheck && npm run sync
        working-directory: apps/android
      - run: |
          chmod +x gradlew
          if ./gradlew assembleDebug testDebugUnitTest lintDebug > android-build.log 2>&1; then
            tail -30 android-build.log
          else
            python3 -c 'from pathlib import Path; s=Path("android-build.log").read_text()[-7000:]; print("::error::"+s.replace("%","%25").replace("\n","%0A").replace("\r","%0D"))'
            exit 1
          fi
        working-directory: apps/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: cea-android-debug
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable KVM for offline-reader emulator smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test packaged offline reader on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          working-directory: apps/android/android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            apps/android/android/app/build/reports/
            apps/android/android/app/build/outputs/androidTest-results/
