name: Native Android release (Play AAB + Direct APK)

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: "Application ID (use ng.cea.app.nativepreview for preview or ng.cea.app for cutover)"
        required: true
        default: "ng.cea.app"
      version_name:
        description: "Release versionName (for example 1.0.0)"
        required: true
        default: "0.6.0-native-preview"
      version_code:
        description: "Monotonically increasing integer versionCode"
        required: true
        default: "6"

concurrency:
  group: native-android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build signed Play AAB & direct APK
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/checkout@v4

      - name: Verify owner-supplied Android signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, or ANDROID_UPLOAD_KEY_PASSWORD in the android-release GitHub Environment."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/signing/upload-keystore.jks"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Bundle public website lessons and figures
        run: node apps/android-native/scripts/build-lessons.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify unit tests, lint, signed Play AAB, and signed direct APK
        working-directory: apps/android-native
        env:
          CEA_APPLICATION_ID: ${{ inputs.application_id }}
          CEA_VERSION_NAME: ${{ inputs.version_name }}
          CEA_VERSION_CODE: ${{ inputs.version_code }}
          CEA_KEYSTORE_PATH: ${{ runner.temp }}/signing/upload-keystore.jks
          CEA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CEA_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CEA_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleRelease
          mkdir -p dist-release
          cp app/build/outputs/bundle/release/*.aab dist-release/
          cp app/build/outputs/apk/release/*.apk dist-release/
          (cd dist-release && sha256sum *.aab *.apk > SHA256SUMS.txt)

      - name: Erase temporary keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - uses: actions/upload-artifact@v4
        with:
          name: cea-native-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: apps/android-native/dist-release/*
          if-no-files-found: error
          retention-days: 30
