name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA newsletter leads
        run: |
          npx -y wrangler@latest d1 execute cea-db --remote --command "DELETE FROM leads WHERE email IN ('qa-e2e-20261008-news2@example.com','qa-e2e-20261008-news@example.com');"
          npx -y wrangler@latest d1 execute cea-db --remote --command "SELECT count(*) AS remaining FROM leads WHERE email LIKE 'qa-e2e-%@example.com';"
