name: Deploy backend
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
    inputs:
      require_fcm:
        description: Require a configured Firebase server credential before deployment
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: deploy-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Cloudflare access
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CF_API_TOKEN and CF_ACCOUNT_ID in secure repository Actions secrets. No deployment performed."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: Prepare server secret without logging its contents
        working-directory: backend
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          REQUIRE_FCM: ${{ github.event_name == 'workflow_dispatch' && inputs.require_fcm }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const raw=process.env.FCM_SERVICE_ACCOUNT_JSON;
          let value;
          try { value=JSON.parse(raw); } catch { throw new Error('Invalid server credential JSON; value withheld.'); }
          if(value.type!=='service_account' || value.project_id!=='cyber-elias-academy-app' ||
             !/^[a-zA-Z0-9-]+@cyber-elias-academy-app\.iam\.gserviceaccount\.com$/.test(value.client_email || '') ||
             !value.private_key?.startsWith('-----BEGIN PRIVATE KEY-----')) throw new Error('Wrong Firebase server credential; value withheld.');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/cea-fcm-secrets.json', JSON.stringify({FCM_SERVICE_ACCOUNT_JSON:raw}), {mode:0o600});
          JS
          elif [ "$REQUIRE_FCM" = "true" ]; then
            npx wrangler secret list > "$RUNNER_TEMP/cea-secret-names.json"
            node --input-type=module <<'JS'
          import fs from 'node:fs';
          const names=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cea-secret-names.json','utf8'));
          if(!Array.isArray(names) || !names.some(item=>item.name==='FCM_SERVICE_ACCOUNT_JSON')) throw new Error('FCM_SERVICE_ACCOUNT_JSON is missing. Add it in secure Actions or Worker settings; never in chat. No migration/deployment performed.');
          JS
          fi
      - name: Backend regression tests (isolated local data)
        run: npm test
        working-directory: backend
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply cea-db --remote
        working-directory: backend
      - name: Upload an exact code version, preserving existing schedules and dashboard variables
        working-directory: backend
        run: |
          extra=()
          if [ -f "$RUNNER_TEMP/cea-fcm-secrets.json" ]; then
            extra+=(--secrets-file "$RUNNER_TEMP/cea-fcm-secrets.json")
          fi
          npx wrangler versions upload --tag "$GITHUB_SHA" --message "CEA source $GITHUB_SHA" --keep-vars --var "DEPLOY_COMMIT:$GITHUB_SHA" "${extra[@]}"
      - name: Deploy that version (do not alter cron triggers)
        working-directory: backend
        run: npx wrangler versions deploy --version-tag "$GITHUB_SHA@100" --yes
      - name: Verify exact deployed revision and DB health
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          let healthy=false;
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const response=await fetch('https://cea-api.cyber-e54.workers.dev/v1/health',{redirect:'error',signal:AbortSignal.timeout(10000)});
              const data=await response.json();
              healthy=response.ok && data.ok===true && data.db==='ok' && data.revision===process.env.EXPECTED_REVISION;
              if(healthy) break;
            } catch {}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!healthy) throw new Error('Exact deployed revision/DB health could not be verified. Do not claim deployment success.');
          console.log('Verified expected source revision and DB health. No notification was sent.');
          JS
      - name: Remove temporary secret material
        if: always()
        run: rm -f "$RUNNER_TEMP/cea-fcm-secrets.json" "$RUNNER_TEMP/cea-secret-names.json"
