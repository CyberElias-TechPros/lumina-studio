name: Deploy backend

# Deploys backend/cea-api on push to main. The migration history matches
# production; `migrations apply` runs all outstanding migrations before deployment.
#
# FREE-PLAN CAVEAT: the Cyber account is at the 5-cron limit, so the deploy
# step cannot install cea-api's 3 cron triggers and exits 1 even when the
# code deploys fine. The step is continue-on-error for that reason; the
# health gate below is the real pass/fail. Fix = Workers Paid or freeing a
# cron slot (see repo docs + ops notes).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cea-db --remote
        working-directory: backend
      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        run: npx wrangler deploy
        working-directory: backend
      - name: Verify health
        run: |
          body="$(curl -fsS https://cea-api.cyber-e54.workers.dev/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"db":"ok"' || { echo "::error::cea-api health check failed"; exit 1; }
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "::warning::Code is live and healthy, but wrangler reported trigger errors (expected: free-plan cron cap). Upgrade to Workers Paid or free a cron slot to clear this."
          fi
