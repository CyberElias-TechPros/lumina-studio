<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7a2434" />
    <title>Connection interrupted | Cyber Elias Academy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8f7f5;
        color: #222;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(100%, 32rem);
        padding: 2rem;
        border: 1px solid #dedbd7;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 12px 36px #221a1a12;
      }
      .mark {
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        place-items: center;
        border-radius: 0.75rem;
        background: #7a2434;
        color: #fff;
        font-weight: 800;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.2;
      }
      p {
        color: #555;
        line-height: 1.65;
      }
      .note {
        padding: 0.9rem 1rem;
        border-left: 3px solid #9c6a1b;
        border-radius: 0.25rem;
        background: #fff7e9;
        color: #473816;
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      button,
      a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #7a2434;
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #7a2434;
        color: #fff;
      }
      a {
        background: transparent;
        color: #7a2434;
      }
      :focus-visible {
        outline: 3px solid #c18b33;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #191718;
          color: #f6f3f1;
        }
        main {
          border-color: #3c3436;
          background: #211e1f;
        }
        p {
          color: #d4ccca;
        }
        .note {
          border-color: #d3a354;
          background: #352d20;
          color: #f5ddb0;
        }
        a {
          color: #f3c6d0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">CE</div>
      <h1>Connection interrupted</h1>
      <p>The Academy workspace could not be reached. Check your connection, then try again.</p>
      <p class="note">
        <strong>Important:</strong> CEA-OS does not queue submissions while offline. If a payment,
        assessment, or message was interrupted, reconnect and check its status before trying again.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Academy home</a>
      </div>
    </main>
  </body>
</html>
